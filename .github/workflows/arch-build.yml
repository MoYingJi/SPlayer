name: Arch Build

on:
  push:
    branches:
      - legacy-continue
    paths:
      - "src/**"
      - "web/**"
      - "electron/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "electron-builder.config.ts"
      - "electron.vite.config.ts"
      - "tsconfig*.json"
      - ".env.example"
      - "Dockerfile"
      - "docker-compose.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run build
        working-directory: package/archlinux
        run: bash workflow.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SPlayer-Arch-Build
          path: package/archlinux/*.pkg.tar.*
