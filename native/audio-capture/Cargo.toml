[package]
name = "audio-capture"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.8", features = ["napi9"] }
napi-derive = "3.5"
tracing = "0.1"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
]

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2"

[build-dependencies]
napi-build = "2.3"
