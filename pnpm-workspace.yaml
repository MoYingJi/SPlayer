packages:
  - "."
  - "native/external-media-integration"
  - "native/ferrous-opencc-wasm"
  - "native/taskbar-lyric"
  - "native/tools"

allowBuilds:
  "@applemusic-like-lyrics/core": true
  "@applemusic-like-lyrics/lyric": true
  "@parcel/watcher": true
  better-sqlite3: true
  core-js: true
  electron: true
  electron-winstaller: true
  esbuild: true
  sharp: true
  vue-demi: true
  register-scheme: false
  wasm-pack: false

blockExoticSubdeps: false

minimumReleaseAgeExclude:
  # 友链，那还说什么了 minimumReleaseAgeExclude 给了
  - "@applemusic-like-lyrics/core"
  - "@applemusic-like-lyrics/lyric"
  - "@neteasecloudmusicapienhanced/api"
  # 一些可能需要及时更新的
  - "electron"
